version: "3.9"

services:
  # ─── PostgreSQL (optional – only starts with --profile dev-db) ───
  postgres_database:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - dev-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raahi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raahi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-raahi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raahi_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── NGINX reverse proxy (raahi / app.raahi / admin.raahi) ───
  nginx:
    image: nginx:alpine
    container_name: raahi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Only the static landing assets are exposed as the web root — never the
      # repository root — so .env, .git and application source stay private.
      - ./index.html:/usr/share/nginx/landing/index.html:ro
      - ./css:/usr/share/nginx/landing/css:ro
      - ./js:/usr/share/nginx/landing/js:ro
      - ./assets:/usr/share/nginx/landing/assets:ro
    depends_on:
      - backend_application
      - web_administration_portal
      - web_employee_progressive_application

  # ─── Backend (FastAPI) ────────────────────────────────────
  backend_application:
    build:
      context: ./applications/backend_application
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://raahi_user:raahi_secret@postgres_database:5432/raahi}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-https://raahi.d14.app/admin}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Razorpay (fare payments + wallet recharge)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_COMPANY_NAME: ${RAZORPAY_COMPANY_NAME:-Raahi}
      # Email (SMTP) — accepts SMTP_USER/SMTP_SECURE aliases too
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Raahi}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@raahi.d14.app}
      # WhatsApp outbound bridge (points at the sidecar service below)
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-http://whatsapp_server:8090}
      WHATSAPP_NOTIFICATION_API_KEY: ${WHATSAPP_NOTIFICATION_API_KEY:-}
    volumes:
      - ./applications/backend_application:/application
    command: uvicorn source.application_startup.main:app --host 0.0.0.0 --port 8000

  # ─── WhatsApp outbound sidecar (whatsapp-web.js) ──────────
  whatsapp_server:
    build:
      context: ./applications/whatsapp_server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
      WHATSAPP_CLIENT_ID: ${WHATSAPP_CLIENT_ID:-raahi-notifications}
      WHATSAPP_NOTIFICATION_API_KEY: ${WHATSAPP_NOTIFICATION_API_KEY:-}
    volumes:
      # Persist the WhatsApp session so the QR is scanned only once.
      - whatsapp_session:/application/.wwebjs_auth

  # ─── Admin + super-admin portal (React + Vite) ────────────
  web_administration_portal:
    build:
      context: ./applications/web_administration_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    # No VITE_API_URL: the app calls same-origin /api, which nginx proxies to
    # the backend. Setting it would force a cross-origin absolute URL.
    volumes:
      - ./applications/web_administration_portal:/application
      - /application/node_modules
    command: npm run dev -- --host 0.0.0.0

  # ─── Employee PWA (React + Vite) ──────────────────────────
  web_employee_progressive_application:
    build:
      context: ./applications/web_employee_progressive_application
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      # Same-origin /api via nginx; only the browser-side keys are injected.
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    volumes:
      - ./applications/web_employee_progressive_application:/application
      - /application/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  whatsapp_session:
