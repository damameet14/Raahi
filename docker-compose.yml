version: "3.9"

services:
  # ─── PostgreSQL (optional – only starts with --profile dev-db) ───
  postgres_database:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - dev-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raahi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raahi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-raahi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raahi_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────
  backend_application:
    build:
      context: ./applications/backend_application
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://raahi_user:raahi_secret@postgres_database:5432/raahi}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PAYMENT_PAGE_URL: ${PAYMENT_PAGE_URL:-http://localhost:5173/payments}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_COMPANY_NAME: ${RAZORPAY_COMPANY_NAME:-Carpooling Platform}
      RAZORPAY_COMPANY_DESCRIPTION: ${RAZORPAY_COMPANY_DESCRIPTION:-Employee completed ride payment}
      RAZORPAY_THEME_COLOR: ${RAZORPAY_THEME_COLOR:-#2fb86f}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_NOTIFICATION_SERVICE_URL: ${EMAIL_NOTIFICATION_SERVICE_URL:-http://email_notification_service:8010}
      INTERNAL_EMAIL_SERVICE_TOKEN: ${INTERNAL_EMAIL_SERVICE_TOKEN:-change-this-in-real-env}
      EMAIL_PAYMENT_PENDING_ENABLED: ${EMAIL_PAYMENT_PENDING_ENABLED:-true}
      EMAIL_PAYMENT_SUCCESS_ENABLED: ${EMAIL_PAYMENT_SUCCESS_ENABLED:-true}
      EMAIL_PAYMENT_FAILED_ENABLED: ${EMAIL_PAYMENT_FAILED_ENABLED:-true}
      EMAIL_SEND_TIMEOUT_MS: ${EMAIL_SEND_TIMEOUT_MS:-10000}
    volumes:
      - ./applications/backend_application:/application
    command: uvicorn source.application_startup.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Frontend (React + Vite) ──────────────────────────────
  web_administration_portal:
    build:
      context: ./applications/web_administration_portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8000}
      VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    volumes:
      - ./applications/web_administration_portal:/application
      - /application/node_modules
    command: npm run dev -- --host 0.0.0.0

  email_notification_service:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /application
    ports:
      - "8010:8010"
    environment:
      EMAIL_SERVICE_PORT: ${EMAIL_SERVICE_PORT:-8010}
      INTERNAL_EMAIL_SERVICE_TOKEN: ${INTERNAL_EMAIL_SERVICE_TOKEN:-change-this-in-real-env}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Carpooling Platform}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PAYMENT_SUPPORT_EMAIL: ${PAYMENT_SUPPORT_EMAIL:-support@example.com}
    volumes:
      - ./applications/email_notification_service:/application
      - /application/node_modules
    command: sh -c "npm install && npm start"

  agent_server:
    build:
      context: ./applications/agent_server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-replace_with_internal_key}
      ERP_DATABASE_URL: ${AGENT_ERP_DATABASE_URL:-postgresql+psycopg2://raahi_user:raahi_secret@postgres_database:5432/raahi}
      CHATBOT_DATABASE_URL: ${CHATBOT_DATABASE_URL:-sqlite:///./data/chatbot.sqlite3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - ./applications/agent_server:/application
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  whatsapp_server:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /application
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      AGENT_SERVER_URL: ${AGENT_SERVER_URL:-http://agent_server:8001}
      AGENT_SERVER_API_KEY: ${INTERNAL_API_KEY:-replace_with_internal_key}
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-65000}
      WHATSAPP_CLIENT_ID: ${WHATSAPP_CLIENT_ID:-raahi-hackathon-chatbot}
      WHATSAPP_NOTIFICATION_API_KEY: ${WHATSAPP_NOTIFICATION_API_KEY:-replace_with_notification_key}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./applications/whatsapp_server:/application
      - /application/node_modules
    command: sh -c "npm install && npm start"

volumes:
  postgres_data:
