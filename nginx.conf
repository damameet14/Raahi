# Raahi reverse proxy — three subdomains behind the Cloudflare tunnel.
#
#   raahi.d14.app        → static marketing landing page
#   app.raahi.d14.app    → employee PWA (Vite dev server)
#   admin.raahi.d14.app  → admin + super-admin portal (Vite dev server)
#
# Every host proxies /api, /docs and /openapi.json to the FastAPI backend, with
# WebSocket upgrade support for journey chat (/api/v1/ws/...) and Vite HMR.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend_application:8000;
}
upstream admin_portal_upstream {
    server web_administration_portal:5173;
}
upstream employee_app_upstream {
    server web_employee_progressive_application:5174;
}

# ─── Marketing landing: raahi.d14.app ───────────────────────
server {
    listen 80 default_server;
    server_name raahi.d14.app;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    root /usr/share/nginx/landing;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── Employee PWA: app.raahi.d14.app ────────────────────────
server {
    listen 80;
    server_name app.raahi.d14.app;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://employee_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ─── Admin + super-admin portal: admin.raahi.d14.app ────────
server {
    listen 80;
    server_name admin.raahi.d14.app;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://admin_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
