upstream backend_application_upstream {
    server backend_application:8000;
}

upstream web_portal_upstream {
    server web_administration_portal:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ─── API requests → backend ─────────────────────────────
    location /api/ {
        proxy_pass http://backend_application_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Swagger docs → backend ─────────────────────────────
    location /docs {
        proxy_pass http://backend_application_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_application_upstream;
        proxy_set_header Host $host;
    }

    # ─── All other requests → frontend ──────────────────────
    location / {
        proxy_pass http://web_portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
