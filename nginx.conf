# Raahi reverse proxy — single domain, path-based routing.
#
#   raahi.d14.app/          → static marketing landing page
#   raahi.d14.app/app/      → employee PWA (Vite dev server)
#   raahi.d14.app/admin/    → admin + super-admin portal (Vite dev server)
#   raahi.d14.app/api/      → FastAPI backend
#
# All services share one hostname, avoiding third-level subdomains that
# the *.d14.app wildcard TLS certificate cannot cover.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend_application:8000;
}
upstream admin_portal_upstream {
    server web_administration_portal:5173;
}
upstream employee_app_upstream {
    server web_employee_progressive_application:5174;
}

server {
    listen 80 default_server;
    server_name raahi.d14.app;
    client_max_body_size 10M;

    # ─── Backend API (/api, /docs, /openapi.json) ───────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # ─── Admin portal: /admin/ → Vite on :5173 ─────────────
    location /admin/ {
        proxy_pass http://admin_portal_upstream/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ─── Employee PWA: /app/ → Vite on :5174 ───────────────
    location /app/ {
        proxy_pass http://employee_app_upstream/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ─── Marketing landing page (static files) ─────────────
    root /usr/share/nginx/landing;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
